name: core-ci

on:
  push:
    branches: [sim-core]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: build + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Build library
        run: cargo build --release --lib
      - name: Test core contract
        run: cargo test --release --tests
